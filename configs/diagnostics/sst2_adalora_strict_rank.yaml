exp_name: sst2_adalora_strict_rank

model_name: bert-base-uncased
dataset_name: nyu-mll/glue
task_name: sst2

method: adalora_strict

init_r: 12
target_r: 2
lora_alpha: 24
lora_dropout: 0.1

target_modules:
  - query
  - value

total_step: 3750
tinit: 200
tfinal: 3000
deltaT: 100
orth_reg_weight: 0.1

max_length: 128
num_train_epochs: 5
learning_rate: 0.0002
weight_decay: 0.01
warmup_steps: 300

train_batch_size: 16
eval_batch_size: 32

seed: 42

max_train_samples: 12000
max_eval_samples: null

rank_threshold: 0.00000001
rank_log_every: 250
eval_every: 750
print_every: 50

output_dir: outputs/sst2_adalora_strict_rank
logging_dir: results/logs/sst2_adalora_strict_rank
metric_file: results/metrics/metrics.csv
rank_file: results/rank/diagnostics/sst2_adalora_strict_rank_rank.csv